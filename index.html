<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>라니킹덤 — 나만의 왕국을 세우다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile-slg.css" />
  <link rel="stylesheet" href="css/korean-theme.css" />
  <link rel="stylesheet" href="css/tutorial-missions.css" />
  <link rel="stylesheet" href="css/save-manager.css" />
  <link rel="stylesheet" href="css/rani-ux.css" />
  <link rel="stylesheet" href="css/rani-native.css" />
  <link rel="stylesheet" href="css/rani-quick-build.css" />
  <link rel="stylesheet" href="css/rani-branding.css" />
  <link rel="preload" as="image" href="assets/branding/rani-kingdom-logo.webp" type="image/webp" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas" aria-label="라니킹덤 3차원 영지 지도"></canvas>

  <!-- ===================== HUD ===================== -->
  <header id="hud-top" class="ui-panel">
    <h1 id="game-title">라니킹덤</h1>
    <section id="score-panel" aria-live="polite">
      <span id="score-label">점수</span>
      <span id="score-value">0</span>
      <span id="score-popup" class="hidden"></span>
    </section>
  </header>

  <aside id="hud-right" class="ui-panel">
    <section id="next-tile-panel">
      <h2 class="panel-title">영토 확장</h2>
      <p id="tile-cap" class="tile-meta">영토: 0 / 14</p>
      <div id="tile-shop-tabs" class="tile-shop-tabs" role="tablist" aria-label="지형 종류 선택"></div>
      <div id="tile-shop" class="tile-shop" role="tabpanel" aria-label="구매 가능한 지형"></div>
      <canvas id="tile-preview" width="220" height="220" aria-label="선택한 지형 미리보기"></canvas>
      <p id="tile-name">—</p>
      <div id="tile-cost-breakdown" class="tile-cost-breakdown" aria-label="지형 설치 비용"></div>
      <p id="tile-prod" class="tile-prod"></p>
      <div class="tile-actions">
        <button id="reroll-btn" class="ui-btn ui-btn--sm" type="button" aria-label="지형 연결 방향 변경">⇄ 연결 변경</button>
        <button id="rotate-btn" class="ui-btn ui-btn--sm" type="button" aria-label="지형 회전">⟳ 회전</button>
      </div>
      <p id="hint-text">지형을 선택한 뒤 지도에서 설치하세요 · R 회전 · V 연결 변경</p>
    </section>
  </aside>

  <footer id="hud-bottom" class="ui-panel">
    <button id="restart-btn" class="ui-btn danger" aria-label="새 왕국 시작">↺ 새로 시작</button>
    <button id="save-manager-btn" class="ui-btn" type="button" aria-label="왕국 저장 관리">💾 저장 관리</button>
    <button id="help-btn" class="ui-btn" type="button" aria-label="게임 방법 열기" aria-haspopup="dialog">❔ 게임 방법</button>
    <button id="debug-btn" class="ui-btn" aria-label="개발 정보 보기">⚙ 개발 정보</button>
    <span id="tiles-placed-label">영토: <b id="tiles-placed">0</b></span>
    <span id="fps-label" class="hidden">초당 화면 수: <b id="fps-value">60</b></span>
  </footer>

  <div id="toast" class="hidden" role="status"></div>

  <div id="loading-screen">
    <div id="loading-inner">
      <h1 id="loading-title" class="loading-brand">
        <img id="loading-logo" src="assets/branding/rani-kingdom-logo.webp"
             alt="라니킹덤" width="720" height="240" decoding="async"
             fetchpriority="high" />
        <span id="loading-logo-fallback" hidden>라니킹덤</span>
      </h1>
      <p id="loading-status" role="status" aria-live="polite">왕국 자료 준비 중 · 0%</p>
      <div id="loading-bar" role="progressbar" aria-label="왕국 불러오기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/ui/MobileDock.js"></script>
  <script type="module" src="src/ui/KoreanGuide.js"></script>
</body>
</html>
