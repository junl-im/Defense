<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Kingdom Seed</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050814; color: #fff; -webkit-touch-callout: none; user-select: none; touch-action: none; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; min-height: 100dvh; overflow: hidden; }
      .shell-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); box-sizing: border-box; color: #fff; background: radial-gradient(circle at 50% 22%, rgba(83,169,255,.38), rgba(8,18,43,.88) 58%, rgba(2,5,12,.96)); }
      .shell-overlay.hidden { display: none !important; }
      .shell-start-card { width: min(420px, 90vw); border: 2px solid rgba(255,218,123,.92); border-radius: 22px; padding: 22px 18px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(120,215,255,.20), transparent 44%), linear-gradient(180deg, rgba(33,52,84,.98), rgba(8,17,38,.98)); box-shadow: 0 24px 70px rgba(0,0,0,.48), 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.22); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shell-title-mark { font-size: 24px; line-height: 1; font-weight: 1000; letter-spacing: .04em; color: #fff0b8; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 18px rgba(255,220,126,.22); }
      .shell-title-sword { width: 68%; height: 2px; margin: 10px auto 0; background: linear-gradient(90deg, transparent, #e7b94e, transparent); }
      .shell-start-card h1 { margin: 10px 0 5px; font-size: 21px; color: #eaf6ff; }
      .shell-start-card p { margin: 0; font-weight: 800; font-size: 13px; color: #bcd7ff; }
      .shell-tap-rune { display: inline-flex; margin-top: 12px; width: 70px; height: 70px; align-items: center; justify-content: center; border-radius: 999px; color: #fff; font-weight: 1000; background: linear-gradient(180deg, #5fa1ff, #255ab5); border: 3px solid #ffd979; box-shadow: 0 12px 34px rgba(27,82,180,.34), inset 0 1px 0 rgba(255,255,255,.46); animation: ksTapPulseV2354 1.25s ease-in-out infinite; }
      .shell-loading-text { margin-top: 10px; color: #fff0b8; font-weight: 1000; font-size: 10px; }
      @keyframes ksTapPulseV2354 { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.07); filter: brightness(1.12); } }
    </style>
  </head>
  <body>
    <div id="start-gate" class="shell-overlay shell-start-gate">
      <div class="shell-start-card" role="button" aria-label="게임 시작">
        <div class="shell-title-mark">KINGDOM SEED</div>
        <div class="shell-title-sword"></div>
        <h1>탭해서 시작</h1>
        <p>첫 화면을 즉시 열고, 무거운 리소스는 뒤에서 준비합니다.</p>
        <div class="shell-tap-rune">TAP</div>
        <div class="shell-loading-text">v2.35.5 초고속 시작 모드</div>
      </div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
