name: Deploy Rani Kingdom Next 2.5D to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-package:
    name: Verify real Fiefdom gameplay, then package with legacy v4
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transform / test / raster CI parity
        run: node rani-next/v518-pipeline-integrity.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical game remains restorable and untouched
        run: |
          set -euo pipefail
          npm test
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          test -s index.html
          test -s assets/rani/asset-integrity-lock-v25.json
          test -f engines/fiefdom/LICENSE
          test -f engines/fiefdom/docs/THIRD-PARTY.md
          test -f engines/fiefdom/public/assets/sprites/0ad/LICENSE.txt
          test "$(git -C engines/fiefdom rev-parse HEAD)" = "8bb66ceeb5a8ec1f77ec899130090061c25078b3"
      - name: Install actual original kingdom engine and run its unit tests
        working-directory: engines/fiefdom
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Transform gameplay engine using approved raster art
        run: |
          node rani-next/prepare.mjs engines/fiefdom
          node rani-next/koreanize.mjs engines/fiefdom
          node rani-next/ko-world.mjs engines/fiefdom
          node rani-next/ko-hud.mjs engines/fiefdom
          node rani-next/no-svg-chart.mjs engines/fiefdom
          node rani-next/v52-scene.mjs engines/fiefdom
          node rani-next/v52-shore.mjs engines/fiefdom
          node rani-next/v53-integrate.mjs engines/fiefdom
          node rani-next/v53-lords.mjs engines/fiefdom
          node rani-next/v54-world-first.mjs engines/fiefdom
          node rani-next/v55-polish.mjs engines/fiefdom
          node rani-next/v56-world-flow.mjs engines/fiefdom
          node rani-next/v57-title.mjs engines/fiefdom
          node rani-next/v57-construction.mjs engines/fiefdom
          node rani-next/v58-precision.mjs engines/fiefdom
          node rani-next/v59-mobile-pages.mjs engines/fiefdom
          node rani-next/v510-world-port.mjs engines/fiefdom
          node rani-next/v511-harbor.mjs engines/fiefdom
          node rani-next/v512-mobile-controls.mjs engines/fiefdom
          node rani-next/v513-mobile-quickbuild.mjs engines/fiefdom
          node rani-next/v514-title-footer.mjs engines/fiefdom
          node rani-next/v515-mobile-reliability.mjs engines/fiefdom
          node rani-next/v516-precision-hex.mjs engines/fiefdom
          node rani-next/v517-economy-vision.mjs engines/fiefdom
          node rani-next/v518-save-durability.mjs engines/fiefdom
          node rani-next/v519-construction-clarity.mjs engines/fiefdom
          node rani-next/v520-mobile-shell.mjs engines/fiefdom
          node rani-next/v521-game-polish.mjs engines/fiefdom
          node rani-next/check.mjs engines/fiefdom
          node rani-next/verify-art.mjs engines/fiefdom
          python -m pip install Pillow==11.3.0
          python rani-next/recolor_world.py engines/fiefdom/public/assets/sprites
          python rani-next/royal-ground.py engines/fiefdom/public/assets/ground
          python rani-next/v52-building-polish.py engines/fiefdom/public/assets/sprites
          python rani-next/v52-forest-polish.py engines/fiefdom/public/assets/sprites
          python rani-next/v511-harbor-sprites.py engines/fiefdom/public/assets/sprites
          python rani-next/v59-pack-sprites.py engines/fiefdom/public/assets/sprites
          python rani-next/v515-mobile-atlas.py engines/fiefdom/public/assets/sprites
      - name: Compile actual game with project-path-aware Vite imports
        working-directory: engines/fiefdom
        run: npm run build -- --base=/Defense/
      - name: Enforce zero SVG files or SVG markup in compiled game
        run: node rani-next/verify-art.mjs engines/fiefdom dist
      - name: Package playable game at /Defense/ and preserve v4 /legacy/
        run: |
          node rani-next/deploy-pack.mjs engines/fiefdom/dist pages-preview/Defense
          test -s pages-preview/Defense/index.html
          test -s pages-preview/Defense/legacy/index.html
          test -s pages-preview/Defense/licenses/FIEFDOM-AGPL-3.0.txt
      - name: Confirm the actual deployed base-path app boots in Chromium
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/rani-deploy-evidence
          python3 -m http.server 8940 --directory pages-preview --bind 127.0.0.1 >/tmp/rani-pages-server.log 2>&1 &
          "$CHROME" --headless=new --remote-debugging-port=9341 --no-sandbox \
            --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader \
            --user-data-dir=/tmp/rani-deploy-chrome >/tmp/rani-pages-browser.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8940/Defense/ >/dev/null && \
               curl -fsS http://127.0.0.1:9341/json/version >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8940/Defense/legacy/ | grep -q 'src/main.js'
          curl -fsS http://127.0.0.1:8940/Defense/SOURCE-AND-ATTRIBUTION.txt | grep -q 'AGPL'
          node rani-next/qa-ui.mjs http://127.0.0.1:8940/Defense/ 9341 /tmp/rani-deploy-evidence/kingdom-game.png
          node rani-next/qa-quickstart.mjs http://127.0.0.1:8940/Defense/ 9341 /tmp/rani-deploy-evidence/direct-world.png
          node rani-next/qa-polish.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v56-flow.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v57-title.mjs http://127.0.0.1:8940/Defense/ 9341 /tmp/rani-deploy-evidence/rani-v57.png
          node rani-next/qa-v57-construction.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v58-precision.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v59-mobile.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v510-port.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v511-harbor.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v512-mobile.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v513-mobile.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v514-title-viewport.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v515-memory.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v516-hex.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v517-economy.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v518-save.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v519-build-cost.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v520-shell.mjs http://127.0.0.1:8940/Defense/ 9341
          node rani-next/qa-v521-visual.mjs http://127.0.0.1:8940/Defense/ 9341
          node engines/fiefdom/tools/e2e/smoke.mjs http://127.0.0.1:8940/Defense/ 9341 /tmp/rani-deploy-evidence/gameplay.png
      - name: Archive deploy-time gameplay QA images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rani-2p5d-deployment-browser-proof
          path: /tmp/rani-deploy-evidence/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-preview/Defense/
  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://junl-im.github.io/Defense/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
