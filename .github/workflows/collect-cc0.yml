name: Collect CC0 originals (artifact only)
on:
  push:
    branches: ["feat/anime-crowd-reboot-v0"]
    paths:
      - '.github/workflows/collect-cc0.yml'
      - 'docs/sources.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare collection folder
        run: mkdir -p originals
      - name: Collect and integrity-check official CC0 archives
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile, json, datetime
          packs=[
            ("oga_animegirl_cc0.zip","https://opengameart.org/sites/default/files/gal.zip"),
            ("oga_female_rigged_cc0.zip","https://opengameart.org/sites/default/files/female_basic_rigged.zip"),
            ("kenney_fantasy_town_cc0.zip","https://opengameart.org/sites/default/files/kenney_fantasy-town-kit_2.0.zip"),
          ]
          dest=pathlib.Path("originals"); dest.mkdir(exist_ok=True)
          statuses=[]
          for name,url in packs:
            record={"file":name,"source":url,"license":"CC0 reported by original publisher","downloaded_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Defense-Asset-Audit/0.1 (game-development; non-commercial-request)"})
              with urllib.request.urlopen(req,timeout=40) as response:
                data=response.read(40_000_000)
              if not data[:2]==b"PK": raise RuntimeError("ZIP header absent / server returned HTML")
              out=dest/name
              out.write_bytes(data)
              with zipfile.ZipFile(out) as z:
                bad=z.testzip()
                if bad: raise RuntimeError("corrupt ZIP member: "+bad)
                record["members"]=len(z.namelist())
              record.update(status="downloaded+zip-verified",size_bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
            except Exception as error:
              (dest/name).unlink(missing_ok=True)
              record.update(status="failed",reason=str(error)[:320])
            statuses.append(record)
          (dest/"collection-report.json").write_text(json.dumps(statuses,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(statuses,indent=2))
          if not any(x["status"]=="downloaded+zip-verified" for x in statuses):
            print("WARNING: No asset ZIP was acquired; review report (never claim success).")
          PY
      - name: Upload original CC0 archives and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defense-cc0-originals
          path: originals
          if-no-files-found: error
          retention-days: 30
