name: Block Survival TPS — CC0 asset intake
on:
  push:
    branches:
      - feature/block-survival-tps-v06-crowd-performance-20261030
      - main
    paths:
      - 'BlockSurvivalTPS/**'
      - '.github/workflows/block-survival-asset-intake.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BlockSurvivalTPS/**'
      - '.github/workflows/block-survival-asset-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Validate 8 pinned CC0 repositories and acquire selected models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect Rani Kingdom archive and untouched current game
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code https://github.com/junl-im/Defense.git refs/heads/archive/rani-kingdom-v539-20261029
          test -s BlockSurvivalTPS/src/sim.mjs
          test -s BlockSurvivalTPS/src/game.mjs
      - name: Audit names, licenses, pinned commits and no SVG
        run: |
          node --test BlockSurvivalTPS/tests/*.test.mjs
          node BlockSurvivalTPS/tools/acquire-open-assets.mjs --check
          if find BlockSurvivalTPS -iname '*.svg' | grep -q .; then
            echo "ERROR: SVG assets forbidden"
            exit 1
          fi
      - name: Acquire curated model originals from exact 8 upstream commits
        shell: bash
        run: |
          node BlockSurvivalTPS/tools/acquire-open-assets.mjs --acquire /tmp/block-survival-cc0
          test -s /tmp/block-survival-cc0/PROVENANCE.json
          test -s /tmp/block-survival-cc0/kaykit-skeletons/Skeleton_Minion.glb
          test -s /tmp/block-survival-cc0/kaykit-adventurers/Knight.glb
          test -s /tmp/block-survival-cc0/kaykit-halloween/gravestone.gltf
          test -s /tmp/block-survival-cc0/kaykit-prototype/Box_A.gltf
          test -s /tmp/block-survival-cc0/kaykit-city-builder/car_police.gltf
          test -s /tmp/block-survival-cc0/kaykit-city-builder/building_A.bin
          test -s /tmp/block-survival-cc0/kenney-fps-media/blaster.glb
          test -s /tmp/block-survival-cc0/kenney-fps-media/enemy_hurt.ogg
          test -s /tmp/block-survival-cc0/kenney-fps-media/crosshair.png
          test -s /tmp/block-survival-cc0/kenney-fps-media/MEDIA_CC0_EVIDENCE_README.md
          test -s /tmp/block-survival-cc0/gobkit-free-lowpoly/minion-a01.glb
          test -s /tmp/block-survival-cc0/gobkit-free-lowpoly/Bat.glb
          test -s /tmp/block-survival-cc0/gobkit-free-lowpoly/TreeLow001.glb
          test -s /tmp/block-survival-cc0/gobkit-free-lowpoly/LICENSE_CC0.txt
          test -s /tmp/block-survival-cc0/kaykit-dungeon-remastered/wall_broken.gltf.glb
          test -s /tmp/block-survival-cc0/kaykit-dungeon-remastered/chest.glb
          echo "Selected CC0 asset files acquired for staging only"
      - name: Archive selected originals with provenance (not website deployment)
        uses: actions/upload-artifact@v4
        with:
          name: block-survival-tps-cc0-verified-assets
          path: /tmp/block-survival-cc0/
          retention-days: 3
          if-no-files-found: error
