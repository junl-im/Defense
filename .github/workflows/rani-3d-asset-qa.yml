name: Rani Kingdom 3D Asset Intake QA
on:
  pull_request:
    paths:
      - 'rani-next/asset-intake.mjs'
      - 'rani-next/asset-intake.test.mjs'
      - 'rani-next/render-asset-4views.py'
      - 'rani-next/ASSET_WORKFLOW.md'
      - '.github/workflows/rani-3d-asset-qa.yml'
  push:
    branches:
      - main
      - 'feature/rani-v536-3d-assets-intake-20261027'
    paths:
      - 'rani-next/asset-intake.mjs'
      - 'rani-next/asset-intake.test.mjs'
      - 'rani-next/render-asset-4views.py'
      - '.github/workflows/rani-3d-asset-qa.yml'
permissions:
  contents: read
jobs:
  asset-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify GLB intake and asset rights tests
        run: node --test rani-next/asset-intake.test.mjs
      - name: Verify Blender render script syntax without installing Blender
        run: python -m py_compile rani-next/render-asset-4views.py
      - name: Validate empty intake directory reports remaining asset list
        run: node rani-next/asset-intake.mjs ./incoming-3d
      # Intentionally do not upload artifacts: prevent build-storage growth.
