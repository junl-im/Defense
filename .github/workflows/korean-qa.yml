name: Validate Korean SLG
on:
  push:
    branches: [feat/korean-first-slg-v02]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  korean-game:
    runs-on: ubuntu-latest
    # The full 29-scenario legacy Chromium suite exceeded 14m on hosted runners.
    # Keep every regression; extend the gate rather than skipping art/save QA.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full source and Korean display content
        run: npm test
      - name: JavaScript syntax
        run: find src scripts -name '*.js' -o -name '*.mjs' | while read f; do node --check "$f" || exit 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve playable SLG
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/kingdom-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/ >/dev/null && break; sleep 1; done
      - name: Run original gameplay logic tests
        run: |
          python test/run_headless.py
          python test/run_headless.py http://127.0.0.1:8123/test/smoke_military.html
      - name: Test Korean game in desktop and mobile Chromium
        run: |
          # Inspect real title art on desktop/mobile/landscape before game regressions.
          # Run the new regression FIRST to detect mistakes before the long legacy suite.
          python scripts/run_legacy_qa.py scripts/qa_lived_in_district_v30.py
          python scripts/run_legacy_qa.py scripts/qa_royal_street_v31.py
          python scripts/run_legacy_qa.py scripts/qa_rani_shell_v33.py
          python scripts/qa_v4_art_direction.py
          # The post-merge v4 mobile smoke now runs BEFORE merge as well.
          python scripts/qa_browser.py
          python scripts/run_legacy_qa.py scripts/qa_built_neighborhood_v32.py
          python scripts/run_legacy_qa.py scripts/qa_branding.py
          python scripts/run_legacy_qa.py scripts/qa_ui_v17.py
          python scripts/run_legacy_qa.py scripts/qa_royal_v18.py
          python scripts/run_legacy_qa.py scripts/qa_royal_world_v19.py
          python scripts/run_legacy_qa.py scripts/qa_royal_infra_v20.py
          python scripts/run_legacy_qa.py scripts/qa_royal_district_v21.py
          python scripts/run_legacy_qa.py scripts/qa_rani_assets_v22.py
          python scripts/run_legacy_qa.py scripts/qa_rani_visual_v23.py
          python scripts/run_legacy_qa.py scripts/qa_royal_field_v24.py
          python scripts/run_legacy_qa.py scripts/qa_rani_integrity_v25.py
          python scripts/run_legacy_qa.py scripts/qa_royal_water_v26.py
          python scripts/run_legacy_qa.py scripts/qa_royal_header_v27.py
          python scripts/run_legacy_qa.py scripts/qa_harbor_fleet_v28.py
          python scripts/run_legacy_qa.py scripts/qa_production_play_v29.py
          # Catch tap/empty-hex/HUD regressions first, then full game suites.
          python scripts/run_legacy_qa.py scripts/qa_quick_build.py
          python scripts/run_legacy_qa.py scripts/qa_korean.py
          python scripts/run_legacy_qa.py scripts/qa_backups.py
          python scripts/run_legacy_qa.py scripts/qa_village.py
          python scripts/run_legacy_qa.py scripts/qa_building_art.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-slg-desktop-mobile
          path: |
            qa/korean/
            qa/backup/
            qa/village/
            qa/building-art/
            qa/quick-build/
            qa/branding/
            qa/ui-v17/
            qa/royal-v18/
            qa/royal-world-v19/
            qa/royal-infra-v20/
            qa/royal-district-v21/
            qa/rani-asset-v22/
            qa/rani-visual-v23/
            qa/royal-field-v24/
            qa/asset-integrity-v25/
            qa/royal-waterfront-v26/
            qa/royal-header-v27/
            qa/harbor-fleet-v28/
            qa/production-play-v29/
            qa/lived-in-district-v30/
            qa/royal-street-v31/
            qa/built-neighborhood-v32/
            qa/immersive-shell-v33/
            qa/visual-v40/
          if-no-files-found: ignore
