name: Defense WebGL visual QA (desktop and mobile)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/assets/**'
      - 'index.html'
      - 'scripts/visual-qa.py'
      - '.github/workflows/visual-qa.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run build
        env:
          VITE_BASE_PATH: /Defense/
      - name: Install Chromium + Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run Vite preview and collect actual WebGL screenshots
        shell: bash
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &)
          sleep 3
          python scripts/visual-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defense-desktop-mobile-visual-qa
          path: |
            logs/qa/visual
            preview.log
          if-no-files-found: warn
