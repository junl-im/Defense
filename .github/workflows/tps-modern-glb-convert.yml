name: TPS v0.7 — convert verified CC0 modern characters to GLB
on:
  push:
    branches: [feature/block-survival-tps-v07-modern-cc0-20261030]
    paths:
      - 'BlockSurvivalTPS/tools/convert-modern-blender.py'
      - '.github/workflows/tps-modern-glb-convert.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Blender and FBX import requirements
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -2
      - name: Fetch CC0 originals, verify pinned author archive and strip SVG
        run: |
          set -euo pipefail
          python3 BlockSurvivalTPS/tools/inspect-modern-source.py >/tmp/tps-source-inspection.log
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/tps-modern-source/SOURCE_MANIFEST.json'))
          expected='9cc53e82c941781f26aa8fb39d40887cf14b1d74cca2d10ccc6e7c140a68f820'
          assert p['sha256']==expected,'Source archive checksum changed'
          assert p['sourceLabel']=='opengameart-kenney-author','Unexpected source mirror'
          assert len([f for f in p['files'] if f['extension']=='.fbx'])==4
          print('PINNED AUTHOR CC0 ZIP VERIFIED',expected)
          PY
          if find /tmp/tps-modern-source -iname '*.svg' | grep -q .; then echo 'SVG leakage'; exit 1; fi
      - name: Create animated modern survivor and zombie GLBs
        run: |
          blender -b -noaudio --python-exit-code 42 --python BlockSurvivalTPS/tools/convert-modern-blender.py -- /tmp/tps-modern-source /tmp/tps-modern-glb | tee /tmp/tps-blender-convert.log
          test ${PIPESTATUS[0]} -eq 0
          test -s /tmp/tps-modern-glb/modernHero.glb
          test -s /tmp/tps-modern-glb/modernZombie.glb
          test -s /tmp/tps-modern-glb/modernRunner.glb
      - name: Upload only verified GLB binaries, original license and provenance
        uses: actions/upload-artifact@v4
        with:
          name: TPS-modern-CC0-GLB-prototype
          path: |
            /tmp/tps-modern-glb/*.glb
            /tmp/tps-modern-source/License.txt
            /tmp/tps-modern-source/SOURCE_MANIFEST.json
            /tmp/tps-blender-convert.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit only validated binary GLBs and SHA provenance to working branch
        if: github.ref == 'refs/heads/feature/block-survival-tps-v07-modern-cc0-20261030'
        run: |
          set -euo pipefail
          mkdir -p BlockSurvivalTPS/runtime
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          src=pathlib.Path('/tmp/tps-modern-glb')
          dest=pathlib.Path('BlockSurvivalTPS/runtime')
          manifest=json.loads(pathlib.Path('/tmp/tps-modern-source/SOURCE_MANIFEST.json').read_text())
          assert manifest['sha256']=='9cc53e82c941781f26aa8fb39d40887cf14b1d74cca2d10ccc6e7c140a68f820'
          assets=[]
          for name in ['modernHero','modernZombie','modernRunner']:
           source=src/(name+'.glb')
           data=source.read_bytes()
           assert data[:4]==b'glTF' and len(data)<=1000000
           glen=int.from_bytes(data[12:16],'little')
           gltf=json.loads(data[20:20+glen])
           assert gltf['skins'] and len(gltf['animations'])==3
           assert {c['name'] for c in gltf['animations']}=={'Idle','Run','Jump'}
           target=dest/(name+'.glb')
           target.write_bytes(data)
           assets.append(dict(id=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),clips=['Idle','Run','Jump'],skinned=True))
          (dest/'PROVENANCE_MODERN.json').write_text(json.dumps(dict(license='CC0-1.0',creator='Kenney',
             originalPage='https://kenney.nl/assets/animated-characters-survivors',
             authorMirror=manifest['source'],sourceZipSha256=manifest['sha256'],
             conversion='Blender 4.0.2 with original PNG atlas; no SVG extracted or distributed',
             assets=assets),ensure_ascii=False,indent=2)+'\n')
          assert not list(dest.rglob('*.svg'))
          print(json.dumps(assets,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BlockSurvivalTPS/runtime/*.glb BlockSurvivalTPS/runtime/PROVENANCE_MODERN.json
          git commit -m 'assets(tps): add 3 verified skinned Kenney survivor/zombie GLBs (CC0, no SVG)'
          git push origin HEAD:feature/block-survival-tps-v07-modern-cc0-20261030
