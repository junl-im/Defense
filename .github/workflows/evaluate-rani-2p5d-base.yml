name: Evaluate Rani 2.5D Source Base (Fiefdom)
on:
  push:
    branches: [spike/rani-complete-isometric-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-fiefdom:
    name: Build upstream isometric castle simulation without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected existing Rani game (no mutation)
        uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - name: Checkout pinned upstream AGPL candidate
        uses: actions/checkout@v4
        with:
          repository: halvar20000/fiefdom
          ref: 8bb66ceeb5a8ec1f77ec899130090061c25078b3
          path: candidate
          persist-credentials: false
      - name: Check upstream copyright, assets and package lock
        working-directory: candidate
        run: |
          test -f LICENSE
          test -f docs/THIRD-PARTY.md
          test -f package-lock.json
          test -f public/assets/sprites/0ad/LICENSE.txt
          grep -q 'AGPL-3.0-only' package.json
          node -e 'const p=require("./package.json"); if (!p.scripts.build || !p.scripts.test) process.exit(1)'
          test -f ../current/assets/rani/asset-integrity-lock-v25.json
          test -f ../current/docs/RANI_KINGDOM_V40_ART_DIRECTED_REBUILD_KO.md
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned upstream dependencies
        working-directory: candidate
        run: npm ci --no-audit --no-fund
      - name: Run original upstream simulation tests
        working-directory: candidate
        run: npm test
      - name: Build real playable upstream web release
        working-directory: candidate
        run: npm run build
      - name: Verify generated game files and preserve licensing
        working-directory: candidate
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"
          mkdir -p dist/licenses
          cp LICENSE dist/licenses/AGPL-3.0.txt
          cp docs/THIRD-PARTY.md dist/licenses/THIRD-PARTY.md
          cp public/assets/sprites/0ad/LICENSE.txt dist/licenses/0AD-CC-BY-SA-3.0.txt
          cat >dist/SOURCE-AND-SCOPE.txt <<'EOF'
          Upstream evaluation only. Fiefdom v1.76.0 by halvar20000.
          Exact candidate source revision:
          https://github.com/halvar20000/fiefdom/tree/8bb66ceeb5a8ec1f77ec899130090061c25078b3
          Code license: AGPL-3.0-only.
          Third-party 0 A.D. derived art: CC BY-SA 3.0 with attribution.
          This is NOT yet the shipped Rani Kingdom game.
          No existing Defense main game, original Rani artwork or save keys changed.
          EOF
          echo "Build output bytes:"
          du -sh dist
          echo "Built asset file count:"
          find dist/assets -type f | wc -l
      - name: Launch actual 2.5D game in headless Chrome and capture screen
        working-directory: candidate
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chromium/Chrome executable is unavailable on runner"
            exit 1
          fi
          mkdir -p qa
          PORT=8931 STATIC_DIR="$PWD/dist" DATA_DIR=/tmp/rani-fiefdom-qa node docker/server.mjs >/tmp/rani-fiefdom-server.log 2>&1 &
          "$CHROME_BIN" --headless=new --remote-debugging-port=9341 --no-sandbox \
            --disable-dev-shm-usage --disable-gpu-sandbox --use-gl=swiftshader \
            --enable-unsafe-swiftshader --user-data-dir=/tmp/rani-fiefdom-chrome \
            >/tmp/rani-fiefdom-chrome.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8931/ >/dev/null && \
               curl -fsS http://127.0.0.1:9341/json/version >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8931/ >/dev/null
          curl -fsS http://127.0.0.1:9341/json/version >/dev/null
          node tools/e2e/smoke.mjs http://127.0.0.1:8931/ 9341 qa/fiefdom-real-2p5d.png
          test -s qa/fiefdom-real-2p5d.png
      - name: Save rendered browser proof separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rani-fiefdom-browser-screenshot-and-logs
          path: |
            candidate/qa/
            /tmp/rani-fiefdom-server.log
            /tmp/rani-fiefdom-chrome.log
          retention-days: 14
          if-no-files-found: warn
      - name: Save separately playable build (NOT GitHub Pages)
        uses: actions/upload-artifact@v4
        with:
          name: rani-candidate-fiefdom-2p5d-build
          path: candidate/dist/
          retention-days: 14
          if-no-files-found: error
