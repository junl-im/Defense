name: Verify integrated Quaternius female rigs
on:
  push:
    branches: [feat/anime-crowd-reboot-v0]
    paths:
      - 'public/assets/characters/**'
      - 'docs/QUATERNIUS_IMPORT.json'
      - 'scripts/verify-quaternius-art.py'
      - '.github/workflows/collect-quaternius.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GLB format, female skeletons, 24 animation clips and SVG policy
        run: |
          python3 scripts/verify-quaternius-art.py
          node scripts/verify-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quaternius-female-rigs-reviewed-format
          path: |
            public/assets/characters
            docs/QUATERNIUS_IMPORT.json
          retention-days: 30
          if-no-files-found: error
