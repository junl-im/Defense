name: Audit external asset acquisition metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/asset-audit.mjs
      - run: node scripts/verify-assets.mjs
