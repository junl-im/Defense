name: Deploy Dokkaebi Luck Defense 3D to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Remove obsolete patch and generated artifacts
        run: npm run clean:obsolete

      - name: Verify source and module contracts
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm run verify 2>&1 | tee verify.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Verification failure digest"
            grep -nE '^(FAIL|::error)|VERIFY FAILURE DIGEST|검증 실패' verify.log || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /Defense/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4