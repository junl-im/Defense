name: Deploy Dokkaebi Luck Defense 3D to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Initialize QA evidence paths
        shell: bash
        run: |
          mkdir -p logs/qa/v148 logs/qa/v149
          printf 'v1.0.48 QA evidence was not produced before this upload step.\n' > logs/qa/v148/_ci-status.txt
          printf 'v1.0.49 QA evidence was not produced before this upload step.\n' > logs/qa/v149/_ci-status.txt

      - name: Setup Python for dependency-free atlas checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair and synchronize canonical release identity
        shell: bash
        run: |
          node scripts/bootstrap-release-package-v149.mjs
          node scripts/generate-release-identity-v149.mjs
          node scripts/verify-release-identity-v149.mjs
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.0.49'||l.version!=='1.0.49'||l.packages?.['']?.version!=='1.0.49') process.exit(1); console.log('PASS CI package identity 1.0.49 before npm ci')"

      - name: Install dependencies
        run: npm ci

      - name: Remove obsolete patch and generated artifacts
        run: npm run clean:obsolete

      - name: Verify generated image checks without optional Python packages
        run: |
          python -S scripts/generate-runtime-atlases-v14.py --check
          python -S scripts/generate-runtime-atlases-v15.py --check
          python -S scripts/generate-visual-polish-assets-v112.py --check
          python -S scripts/generate-p0-directional-atlases-v112.py --check

      - name: Verify source and module contracts
        shell: bash
        run: |
          set -o pipefail
          status=0
          mkdir -p logs/verify
          npm run verify:ci 2>&1 | tee logs/verify/ci-verify.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Verification failure digest"
            grep -nE '^(FAIL|::error)|VERIFY FAILURE DIGEST|검증 실패' logs/verify/ci-verify.log || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs/build
          npm run build 2>&1 | tee logs/build/ci-build.log
        env:
          VITE_BASE_PATH: /Defense/


      - name: Verify approved asset static deployment
        env:
          REQUIRE_BROWSER_V144: 1
          REQUIRE_BROWSER_V145: 1
          REQUIRE_BROWSER_V146: 1
          REQUIRE_BROWSER_V147: 1
          REQUIRE_BROWSER_V149: 1
        run: |
          # npm run verify:dist:v117
          # npm run verify:dist:v118
          # npm run verify:dist:v119
          # npm run verify:dist:v120
          # npm run verify:dist:v121
          # npm run verify:dist:v122
          # npm run verify:dist:v123
          # npm run verify:dist:v124
          # npm run verify:dist:v125
          # npm run verify:dist:v126
          # npm run verify:dist:v127
          # npm run verify:dist:v128
          # npm run verify:dist:v129
          # npm run verify:dist:v131
          # npm run verify:dist:v132
          # npm run verify:dist:v133
          # npm run verify:dist:v134
          # npm run verify:dist:v135
          # npm run verify:dist:v136
          # npm run verify:dist:v137
          # npm run verify:dist:v138
          # npm run verify:dist:v139
          # npm run verify:dist:v140
          # npm run verify:dist:v141
          # npm run verify:dist:v142
          npm run verify:dist:all

      - name: Upload v1.0.44 mobile QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.44-mobile-qa
          path: logs/qa/v144
          if-no-files-found: ignore

      - name: Upload v1.0.45 long-session QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.45-long-session-qa
          path: logs/qa/v145
          if-no-files-found: ignore

      - name: Upload v1.0.46 release assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.46-release-assurance
          path: logs/qa/v146
          if-no-files-found: ignore

      - name: Upload v1.0.47 offline and compact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.47-offline-evidence
          path: logs/qa/v147
          if-no-files-found: ignore

      - name: Upload v1.0.48 system integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.48-system-integrity
          path: logs/qa/v148
          if-no-files-found: ignore

      - name: Upload v1.0.49 runtime architecture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.49-runtime-architecture
          path: logs/qa/v149
          if-no-files-found: ignore

      - name: Verify self-contained production bundle
        run: node scripts/verify-production-bundle-v101.mjs

      - name: Final root hygiene check
        run: npm run hygiene:check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4