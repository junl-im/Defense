name: Block Survival TPS — standalone playable alpha
on:
  push:
    branches: [feature/block-survival-tps-v01-20261029, main]
    paths:
      - 'BlockSurvivalTPS/**'
      - '.github/workflows/block-survival-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BlockSurvivalTPS/**'
      - '.github/workflows/block-survival-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rani original remains and isolate TPS
        run: |
          git ls-remote --exit-code https://github.com/junl-im/Defense.git refs/heads/archive/rani-kingdom-v539-20261029
          test -d BlockSurvivalTPS/src
          test -s BlockSurvivalTPS/research/source-lock.json
      - name: Syntax, gameplay and source/license tests
        run: |
          node --check BlockSurvivalTPS/src/game.mjs
          node --check BlockSurvivalTPS/src/sim.mjs
          node --test BlockSurvivalTPS/tests/*.test.mjs
          node BlockSurvivalTPS/tools/acquire-open-assets.mjs --check
          if find BlockSurvivalTPS -iname '*.svg' | grep -q .; then
            echo 'SVG is prohibited'; exit 1
          fi
      - name: Install exact pinned open-source dependencies
        run: npm install --prefix BlockSurvivalTPS --no-audit --no-fund
      - name: Bundle Three.js into standalone static game
        run: |
          npm run build --prefix BlockSurvivalTPS
          node BlockSurvivalTPS/tools/verify-preview.mjs
          node --check BlockSurvivalTPS/dist/game.bundle.js
          test -s BlockSurvivalTPS/dist/THREE_LICENSE.txt
          test -s BlockSurvivalTPS/dist/BLOCK_SURVIVAL_TPS_바로실행.html
      - name: Quick static HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory BlockSurvivalTPS/dist >/tmp/tps-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://localhost:8765/ | grep -q '블록 서바이벌 TPS'
          curl --fail --silent --show-error http://localhost:8765/game.bundle.js | head -c 8 >/dev/null || :
      - name: Upload isolated playable preview only (not Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: block-survival-tps-playable-alpha-v01
          path: BlockSurvivalTPS/dist/
          retention-days: 7
          if-no-files-found: error
