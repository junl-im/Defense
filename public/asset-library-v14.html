<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokkaebi Runtime Atlas v14</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080c16;color:#eef6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1e3151,#080c16 56%);min-height:100vh}main{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(25px,4vw,45px)}.top p{margin:7px 0 0;color:#9fc2df}.summary{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin:20px 0}.summary article{padding:13px;border:1px solid #304967;border-radius:16px;background:#101a2b}.summary small{display:block;color:#8caac5}.summary b{font-size:24px}.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;position:sticky;top:0;z-index:2;padding:10px 0;background:#080c16dd;backdrop-filter:blur(14px)}input,select{width:100%;padding:11px;border-radius:12px;border:1px solid #34506e;background:#0e1929;color:#fff}.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}.page{border:1px solid #304967;border-radius:18px;padding:10px;background:#0e1929}.page img{width:100%;display:block;border-radius:12px;background-color:#eef1f4;background-image:linear-gradient(45deg,#dce1e5 25%,transparent 25%),linear-gradient(-45deg,#dce1e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce1e5 75%),linear-gradient(-45deg,transparent 75%,#dce1e5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border:1px solid #2d4664;border-radius:15px;background:#0e1929;overflow:hidden}.sprite{aspect-ratio:1;background-image:var(--img);background-size:var(--sx) var(--sy);background-position:var(--x) var(--y);background-repeat:no-repeat;background-color:#e9edf1}.meta{padding:9px}.meta b,.meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:#8caac5}.tag{display:inline-flex;margin-top:7px;padding:3px 7px;border-radius:99px;background:#1f3d5a;color:#c7ecff;font-size:11px}.tag.curated{background:#57461d;color:#ffe39a}@media(max-width:760px){main{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.pages{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><section class="top"><div><h1>Runtime Atlas Forge v14</h1><p>v13 투명 스프라이트 124개 · 가장자리 정리 · 1페이지 WebP/PNG 아틀라스</p></div><b>2D RUNTIME · FINAL 3D APPROVAL 0</b></section><section id="summary" class="summary"></section><section id="pages" class="pages"></section><section class="controls"><input id="search" placeholder="ID 또는 별칭 검색"><select id="category"><option value="">전체 카테고리</option></select><select id="status"><option value="">전체 상태</option><option value="atlas-curated">atlas-curated</option><option value="atlas-runtime-ready">atlas-runtime-ready</option></select></section><section id="grid" class="grid"></section></main>
<script type="module">
const data=await fetch('./assets/ip-v14/atlas-manifest-v14.json').then(r=>r.json());const {summary,pages,frames}=data;const $=s=>document.querySelector(s);$('#summary').innerHTML=`<article><small>런타임 프레임</small><b>${summary.totalFrames}</b></article><article><small>선별 프레임</small><b>${summary.curatedFrames}</b></article><article><small>아틀라스 페이지</small><b>${summary.atlasPages}</b></article><article><small>경계 자동 통과</small><b>${summary.edgeMasterPass}</b></article><article><small>페이지 크기</small><b>${summary.pageWidth}×${summary.pageHeight}</b></article><article><small>3D 최종 승인</small><b>${summary.production3DApproved}</b></article>`;$('#pages').innerHTML=pages.map((p,i)=>`<article class="page"><img src="./${p.webp}" alt="런타임 아틀라스 페이지 ${i+1}"><small>PAGE ${i+1} · ${p.columns}×${p.rows} · WebP/PNG</small></article>`).join('');[...new Set(frames.map(f=>f.category))].sort().forEach(v=>$('#category').insertAdjacentHTML('beforeend',`<option>${v}</option>`));function render(){const q=$('#search').value.toLowerCase();const cat=$('#category').value;const st=$('#status').value;const rows=frames.filter(f=>(!cat||f.category===cat)&&(!st||f.status===st)&&(!q||`${f.id} ${f.alias||''}`.toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(f=>{const page=pages[f.page];const x=f.x/(page.width-summary.tileSize)*100;const y=f.y/(page.height-summary.tileSize)*100;return `<article class="card"><div class="sprite" style="--img:url('./${page.webp}');--sx:${page.columns*100}%;--sy:${page.rows*100}%;--x:${x}%;--y:${y}%"></div><div class="meta"><b>${f.alias||f.id}</b><small>${f.category} · Q${f.audit.quality} · fringe ${(f.audit.fringeRatio*100).toFixed(1)}%</small><span class="tag ${f.alias?'curated':''}">${f.status}</span></div></article>`}).join('')}['search','category','status'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
