<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokkaebi IP Library v8</title><style>*{box-sizing:border-box}body{margin:0;background:#090d13;color:#eef5ff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:2;padding:16px;background:#0c121bdd;border-bottom:1px solid #314057}h1{margin:0 0 6px}.meta{color:#9fb0c5}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button,input{padding:9px 11px;border-radius:8px;border:1px solid #34455d;background:#151d29;color:#fff}button.active{color:#ffd66d;border-color:#ffd66d}main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}article{border:1px solid #2c3a4e;background:#111923;border-radius:10px;overflow:hidden}.thumb{height:135px;display:flex;align-items:center;justify-content:center;background:#18222f}img{max-width:100%;max-height:100%;object-fit:contain}.info{padding:8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{color:#66dcff;margin-top:4px}</style></head><body><header><h1>DOKKAEBI DEFENSE · IP LIBRARY v8</h1><div class="meta">970 raster assets · curated 141 · raw 823 · SVG 0</div><div class="tools"><button class="active" data-c="all">ALL</button><button data-c="characters">CHARACTER</button><button data-c="monsters">MONSTER</button><button data-c="bosses">BOSS</button><button data-c="ui">UI</button><button data-c="vfx">VFX</button><button data-c="objects">OBJECT</button><button data-c="atlas">ATLAS</button><input id="q" placeholder="search"></div></header><main id="g"></main><script>let A=[],C='all',Q='';const g=document.getElementById('g');function r(){let x=A.filter(a=>(C==='all'||a.category===C||a.category.startsWith(C))&&a.id.includes(Q));g.innerHTML=x.map(a=>`<article><div class="thumb"><img loading="lazy" src="${a.path}"></div><div class="info">${a.id}<div class="tag">${a.category} · ${a.tier}</div></div></article>`).join('')}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');C=b.dataset.c;r()});q.oninput=e=>{Q=e.target.value.toLowerCase();r()};fetch('./assets/ip-v8/catalog.json').then(x=>x.json()).then(x=>{A=x.assets;r()})</script></body></html>
