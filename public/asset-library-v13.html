<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokkaebi Sprite Forge v13</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090d18;color:#edf6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182848,#090d18 52%);min-height:100vh}main{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(24px,4vw,44px)}.top p{margin:6px 0 0;color:#9fc0dc}.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:20px 0}.summary article{padding:13px;border:1px solid #314669;border-radius:16px;background:#101a2c}.summary small{display:block;color:#8aa9c7}.summary b{font-size:25px}.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;position:sticky;top:0;z-index:2;padding:10px 0;background:#090d18dd;backdrop-filter:blur(14px)}input,select{width:100%;padding:11px;border-radius:12px;border:1px solid #334b70;background:#0f192a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card{min-width:0;border:1px solid #2c4161;border-radius:16px;background:#0f192a;overflow:hidden}.preview{aspect-ratio:1;display:grid;place-items:center;background-color:#e9edf1;background-image:linear-gradient(45deg,#d8dde2 25%,transparent 25%),linear-gradient(-45deg,#d8dde2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d8dde2 75%),linear-gradient(-45deg,transparent 75%,#d8dde2 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{width:100%;height:100%;object-fit:contain}.meta{padding:10px}.meta b,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:#8aa9c7}.tag{display:inline-flex;margin-top:7px;padding:3px 7px;border-radius:99px;background:#213759;color:#bfe8ff;font-size:11px}.tag.review{background:#4b2f26;color:#ffd3a4}@media(max-width:700px){main{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><section class="top"><div><h1>Sprite Forge v13</h1><p>사용자 제공 시트 10장 · 체크 배경 제거 · 415개 자동 크롭</p></div><b>2D RUNTIME ONLY · 3D 승인 0</b></section><section id="summary" class="summary"></section><section class="controls"><input id="search" placeholder="ID 또는 별칭 검색"><select id="category"><option value="">전체 카테고리</option></select><select id="status"><option value="">전체 상태</option><option value="curated-runtime-2d">curated-runtime-2d</option><option value="runtime-ready-2d">runtime-ready-2d</option><option value="review">review</option></select></section><section id="grid" class="grid"></section></main>
<script type="module">
const data=await fetch('./assets/ip-v13/asset-manifest-v13.json').then(r=>r.json());const {summary,assets}=data;const $=s=>document.querySelector(s);$('#summary').innerHTML=`<article><small>소스 시트</small><b>${summary.sourceSheets}</b></article><article><small>개별 크롭</small><b>${summary.totalCrops}</b></article><article><small>자동 준비</small><b>${summary.runtimeReady2D}</b></article><article><small>검수 필요</small><b>${summary.needsReview}</b></article><article><small>3D 최종 승인</small><b>${summary.production3DApproved}</b></article>`;[...new Set(assets.map(a=>a.category))].sort().forEach(v=>$('#category').insertAdjacentHTML('beforeend',`<option>${v}</option>`));function render(){const q=$('#search').value.toLowerCase();const cat=$('#category').value;const st=$('#status').value;const rows=assets.filter(a=>(!cat||a.category===cat)&&(!st||a.status===st)&&(!q||`${a.id} ${a.alias||''}`.toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(a=>`<article class="card"><div class="preview"><img loading="lazy" src="./${a.path}" alt="${a.alias||a.id}"></div><div class="meta"><b>${a.alias||a.id}</b><small>${a.category} · ${a.id}</small><span class="tag ${a.status==='review'?'review':''}">${a.status}</span></div></article>`).join('')}['search','category','status'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));render();
</script></body></html>
