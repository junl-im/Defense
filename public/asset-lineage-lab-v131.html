<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v1.0.31 에셋 계보 검수</title><style>body{font:15px system-ui;background:#171321;color:#eee;margin:0;padding:24px}main{max-width:980px;margin:auto}pre{background:#0d0a14;padding:16px;border-radius:12px;overflow:auto}.ok{color:#8ef0b0}.bad{color:#ff9b9b}</style></head><body><main><h1>v1.0.31 에셋 계보 검수</h1><p>보스 3종·몬스터 7종의 저/중/고해상도 30파일을 감사합니다.</p><pre id="out">불러오는 중…</pre><script type="module">const e=document.querySelector('#out');try{const r=await fetch('./assets/visual-v131/asset-lineage-audit-v131.json',{cache:'no-store'});const j=await r.json();const files=j.assets.flatMap(a=>a.variants);const unique=new Set(files.map(x=>x.sha256)).size;e.className=files.length===30&&unique===30?'ok':'bad';e.textContent=JSON.stringify({version:j.version,assets:j.assets.length,files:files.length,uniqueHashes:unique,duplicateGroups:j.exactDuplicateGroups},null,2)}catch(x){e.className='bad';e.textContent=String(x)}</script></main></body></html>
