<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도깨비 럭 디펜스 · 승인 자산 관리 v1.0.17</title><style>
:root{color-scheme:dark;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;background:#10131d;color:#f7f2e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28314c 0,#121521 45%,#090b12 100%);min-height:100vh}.wrap{max-width:1320px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border:1px solid #d9ac58;border-radius:999px;color:#f4ce84;background:#342816}h1{margin:10px 0 4px;font-size:clamp(28px,4vw,54px)}p{color:#bfc8dc}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.card{background:rgba(25,30,45,.92);border:1px solid #3d4661;border-radius:16px;padding:16px;box-shadow:0 16px 40px #0007}.n{font-size:32px;font-weight:800;color:#ffd481}.ok{color:#71e5a2}.warn{color:#ffca68}.bad{color:#ff788d}.section{margin-top:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.preview{width:100%;border-radius:12px;background:#070910;border:1px solid #3d4661;image-rendering:auto}.pill{display:inline-block;margin:3px 4px 0 0;padding:4px 8px;border-radius:999px;background:#26324d;font-size:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #30384d;text-align:left}.small{font-size:13px;color:#aeb7ca}code{color:#a8e8ff}</style></head><body><main class="wrap"><div class="top"><div><span class="badge">ART APPROVAL PIPELINE</span><h1>승인 자산 관리 v1.0.17</h1><p>방향 원화 승인과 액션 원화 승인을 분리해 관리합니다.</p></div><div id="identity" class="small">불러오는 중…</div></div><div id="summary" class="summary"></div><section class="section"><div class="grid"><article class="card"><h2>푸푸도깨비 11방향</h2><img class="preview" src="./assets/visual-v117/directional/guardian-ember-pupu-turntable-v117.webp" alt="푸푸도깨비 11방향 턴테이블"><p><span class="pill ok">방향 원화 승인</span><span class="pill warn">액션 행 임시 파생</span><span class="pill">좌우 반전 금지</span></p><p class="small">11개 방향 실루엣은 런타임 적용 승인. 이동·공격·스킬·피격·사망 행은 다음 독립 액션 원화 교체 전까지 파생 연출로 표시됩니다.</p></article><article class="card"><h2>수호성 4상태</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)"><img class="preview" src="./assets/visual-v117/citadel/guardian-citadel-stable-medium-v117.webp" alt="안정"><img class="preview" src="./assets/visual-v117/citadel/guardian-citadel-shielded-medium-v117.webp" alt="보호막"><img class="preview" src="./assets/visual-v117/citadel/guardian-citadel-cracked-medium-v117.webp" alt="균열"><img class="preview" src="./assets/visual-v117/citadel/guardian-citadel-critical-medium-v117.webp" alt="위기"></div><p><span class="pill ok">4상태 승인</span><span class="pill ok">런타임 적용</span></p></article></div></section><section class="section card"><h2>승인·교체 대기 큐</h2><table class="table"><thead><tr><th>ID</th><th>분류</th><th>상태</th><th>런타임</th></tr></thead><tbody id="queue"></tbody></table></section><section class="section card"><h2>파일 무결성</h2><table class="table"><thead><tr><th>자산</th><th>크기</th><th>해상도</th><th>SHA-256</th></tr></thead><tbody id="files"></tbody></table></section></main><script>
Promise.all([
fetch('./assets/visual-v117/asset-approval-manifest-v117.json',{cache:'no-store'}).then(r=>r.json()),
fetch('./assets/visual-v117/asset-approval-registry-v117.json',{cache:'no-store'}).then(r=>r.json())
]).then(([m,r])=>{identity.textContent=`${m.version} / ${m.build} · ${m.policyId}`;const s=m.summary;summary.innerHTML=[['승인 방향 개체',s.directionalEntitiesApproved,'ok'],['승인 방향 원화',s.directionViewsApproved,'ok'],['임시 액션 행',s.actionRowsProvisional,'warn'],['승인 수호성 상태',s.citadelStatesApproved,'ok'],['격리 구형 시트',s.oldPrototypeAtlasesQuarantined,'bad']].map(([l,n,c])=>`<div class="card"><div class="n ${c}">${n}</div><div>${l}</div></div>`).join('');queue.innerHTML=r.entries.map(e=>`<tr><td><code>${e.id}</code><div class="small">${e.notes}</div></td><td>${e.category}</td><td class="${e.status==='approved'?'ok':e.status==='quarantined'?'bad':'warn'}">${e.status}</td><td>${e.runtimeApplied?'적용':'제외'}</td></tr>`).join('');files.innerHTML=m.files.map(f=>`<tr><td><code>${f.path.replace('public/','')}</code></td><td>${(f.bytes/1024).toFixed(1)}KB</td><td>${f.dimensions.join('×')}</td><td class="small">${f.sha256.slice(0,18)}…</td></tr>`).join('')}).catch(e=>{identity.textContent='승인 데이터 로드 실패';console.error(e)});
</script></body></html>
