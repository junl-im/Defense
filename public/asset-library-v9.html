<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#08111f" />
  <title>Dokkaebi Asset Review OS v9</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0e1928;--line:#273c55;--gold:#ffd872;--cyan:#6be7ff;--muted:#9fb0c5;--danger:#ff7d7d;--ok:#8ff5b6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172b43 0,#08111f 40%,#050a12 100%);color:#f2f7ff;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;padding:18px clamp(14px,3vw,34px);background:#08111fee;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}h1{margin:0;font-size:clamp(22px,4vw,38px);letter-spacing:-.04em}h1 em{color:var(--gold);font-style:normal}.subtitle{margin:5px 0 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-top:14px}.summary article{padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#111d2c}.summary small,.card small{display:block;color:var(--muted);font-size:10px}.summary b{font-size:20px}.summary .approved b{color:var(--danger)}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px}.tools button,.tools input,.tools select{min-height:38px;padding:8px 11px;border:1px solid #35506f;border-radius:10px;background:#101c2c;color:#fff}.tools button.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px #ffd87255 inset}.tools input{min-width:min(320px,100%);flex:1}.notice{padding:12px clamp(14px,3vw,34px);border-bottom:1px solid #412d2d;background:#2d1717;color:#ffd0d0}.notice b{color:#fff}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:18px clamp(14px,3vw,34px) 60px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#121e2e,#0b1421);box-shadow:0 12px 30px #0004}.thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1.15;background:linear-gradient(135deg,#e9edf2,#cbd3dc);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.tier{position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:999px;background:#07101ddd;border:1px solid #ffffff22;font-size:9px;font-weight:800;letter-spacing:.04em}.tier.high-resolution-candidate{color:var(--gold);border-color:#ffd87277}.tier.reference-crop{color:var(--cyan)}.tier.quarantined-fragment{color:#ff9b9b}.tier.source-atlas{color:#c6a8ff}.score{position:absolute;right:8px;top:8px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#07101ddd;border:1px solid #ffffff33;font-weight:900}.info{padding:11px}.id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:10px}.issues{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}.issues span{padding:3px 5px;border-radius:6px;background:#24191c;color:#ffb7b7;font-size:8px}.family{color:var(--cyan);font-size:9px;margin-top:6px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{width:min(900px,94vw);border:1px solid var(--line);border-radius:18px;background:#0b1523;color:#fff;padding:0;box-shadow:0 24px 80px #000b}dialog::backdrop{background:#02050bcc}.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr)}.detail img{width:100%;height:100%;max-height:75vh;object-fit:contain;background:#e8edf2}.detail section{padding:20px}.detail h2{overflow-wrap:anywhere}.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}.detail dt{color:var(--muted)}.detail dd{margin:0}.close{float:right;border:1px solid var(--line);background:#142236;color:#fff;border-radius:10px;padding:7px 10px}@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail img{max-height:48vh}}
  </style>
</head>
<body>
<header>
  <h1>DOKKAEBI <em>ASSET REVIEW OS</em> v9</h1>
  <p class="subtitle">Absolute Art Bible v2.0 기준으로 파일 수와 실제 제작 후보를 분리합니다.</p>
  <div id="summary" class="summary"></div>
  <div class="tools">
    <button class="active" data-tier="high-resolution-candidate">고해상도 후보</button>
    <button data-tier="reference-crop">참고 크롭</button>
    <button data-tier="quarantined-fragment">격리 조각</button>
    <button data-tier="source-atlas">원본 아틀라스</button>
    <button data-tier="all">전체</button>
    <select id="category"><option value="all">모든 분류</option></select>
    <input id="search" type="search" placeholder="ID, 계열, 원본 이름 검색" />
  </div>
</header>
<div class="notice"><b>중요:</b> 970개는 완성 에셋 수가 아닙니다. 최종 제작 승인 0종이며, 40개 고해상도 파일도 단일 시점 콘셉트 후보입니다.</div>
<main id="grid"><div class="empty">에셋 품질 레지스트리를 불러오는 중...</div></main>
<dialog id="detail"><div class="detail"><img id="detail-img" alt="" /><section><button class="close" type="button">닫기</button><small>ABSOLUTE REVIEW</small><h2 id="detail-title"></h2><dl id="detail-meta"></dl><div id="detail-issues" class="issues"></div></section></div></dialog>
<script>
let assets=[],activeTier='high-resolution-candidate';const grid=document.querySelector('#grid'),search=document.querySelector('#search'),category=document.querySelector('#category'),detail=document.querySelector('#detail');
const tierLabel={"high-resolution-candidate":"HIGH-RES REVIEW","reference-crop":"REFERENCE CROP","quarantined-fragment":"QUARANTINE","source-atlas":"SOURCE ATLAS"};
function render(){const q=search.value.trim().toLowerCase(),cat=category.value;const list=assets.filter(a=>(activeTier==='all'||a.reviewTier===activeTier)&&(cat==='all'||a.category===cat)&&(!q||`${a.id} ${a.family} ${a.source}`.toLowerCase().includes(q))).sort((a,b)=>b.reviewScore-a.reviewScore||a.id.localeCompare(b.id));grid.innerHTML=list.length?list.map(a=>`<article class="card" data-id="${a.id}"><div class="thumb"><img loading="lazy" src="${a.path}" alt="${a.id}"><span class="tier ${a.reviewTier}">${tierLabel[a.reviewTier]}</span><span class="score">${a.reviewScore}</span></div><div class="info"><div class="id">${a.id}</div><div class="meta"><span>${a.category}</span><span>${a.width}×${a.height}</span></div><div class="family">${a.family}</div><div class="issues">${a.issues.slice(0,3).map(x=>`<span>${x}</span>`).join('')}</div></div></article>`).join(''):`<div class="empty">조건에 맞는 에셋이 없습니다.</div>`;grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(assets.find(a=>a.id===el.dataset.id)))}
function openDetail(a){if(!a)return;document.querySelector('#detail-img').src=a.path;document.querySelector('#detail-title').textContent=a.id;document.querySelector('#detail-meta').innerHTML=`<dt>분류</dt><dd>${a.category}</dd><dt>리뷰 단계</dt><dd>${tierLabel[a.reviewTier]}</dd><dt>점수</dt><dd>${a.reviewScore} · ${a.qualityBand}</dd><dt>크기</dt><dd>${a.width}×${a.height}</dd><dt>배경</dt><dd>${a.background}</dd><dt>권장 용도</dt><dd>${a.recommendedUse}</dd><dt>원본</dt><dd>${a.source}</dd><dt>제작 승인</dt><dd>NO</dd>`;document.querySelector('#detail-issues').innerHTML=a.issues.map(x=>`<span>${x}</span>`).join('');detail.showModal()}
document.querySelector('.close').onclick=()=>detail.close();detail.onclick=e=>{if(e.target===detail)detail.close()};document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tier]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTier=b.dataset.tier;render()});search.oninput=render;category.onchange=render;
fetch('./assets/ip-v8/quality-registry-v9.json').then(r=>r.json()).then(data=>{assets=data.assets;const s=data.summary;document.querySelector('#summary').innerHTML=`<article><small>전체 파일</small><b>${s.totalFiles}</b></article><article><small>고해상도 후보</small><b>${s.highResolutionCandidates}</b></article><article><small>참고 크롭</small><b>${s.referenceCrops}</b></article><article><small>격리 조각</small><b>${s.quarantinedFragments}</b></article><article class="approved"><small>최종 승인</small><b>${s.productionApproved}</b></article>`;[...new Set(assets.map(a=>a.category))].sort().forEach(c=>category.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));render()}).catch(e=>grid.innerHTML=`<div class="empty">레지스트리 로드 실패: ${e.message}</div>`);
</script>
</body>
</html>
