<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도깨비 럭 디펜스 3D · v1.0.32 실루엣 검수</title><style>
:root{color-scheme:dark;--bg:#07101d;--panel:#101d31;--line:#34506f;--ok:#8ff5b6;--warn:#ffe08a;--muted:#9fb0c5}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 20% 0,#1b2f49,#07101d 45%,#030711);color:#eef7ff;font:14px/1.5 system-ui,sans-serif}main{max-width:920px;margin:auto}h1{margin:0 0 8px;font-size:clamp(24px,5vw,42px)}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#132238,#0c1728);box-shadow:0 14px 36px #0005}.n{font-size:30px;font-weight:900;color:var(--ok)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #ffffff18;text-align:left}code{color:#9ceaff}.tag{display:inline-block;margin:3px;padding:5px 8px;border-radius:999px;background:#19344b;color:#b9edff;font-size:11px}</style></head><body><main><h1>v1.0.32 실루엣·액션 증거 검수</h1><div class="sub">파일 해시로 고정된 10종 실루엣 지문, 66셀 액션 증거, 80웨이브 자원 회수를 확인합니다.</div><section class="grid" id="summary"></section><section class="card"><h2>유사도 상위 검토</h2><table><thead><tr><th>대상</th><th>점수</th><th>판정</th></tr></thead><tbody id="pairs"></tbody></table></section><section class="card"><h2>승인 경계</h2><span class="tag">푸푸 11방향 최종 승인 유지</span><span class="tag">독립 액션 파생 임시</span><span class="tag">폭탄병 런타임 격리</span><span class="tag">신규 최종 원화 0종</span><p>진단: <code>window.__DOKKAEBI_SILHOUETTE_ASSURANCE_V132__</code></p></section></main><script>
Promise.all([fetch('./assets/visual-v132/silhouette-audit-v132.json').then(r=>r.json()),fetch('./assets/visual-v132/action-evidence-v132.json').then(r=>r.json())]).then(([s,a])=>{summary.innerHTML=[[s.summary.assets,'감사 캐릭터'],[s.summary.pairs,'실루엣 비교'],[s.summary.nearDuplicatePairs,'근접 중복'],[a.summary.cells,'액션 셀'],[a.summary.exactRgbaMatchesAgainstIdle,'완전 동일 액션']].map(([n,l],i)=>`<article class="card"><div class="n ${i===2&&n>0?'warn':''}">${n}</div><div>${l}</div></article>`).join('');pairs.innerHTML=s.pairs.slice(0,5).map(p=>`<tr><td>${p.a} ↔ ${p.b}</td><td>${p.score.toFixed(5)}</td><td>${p.nearDuplicate?'중복 위험':p.review?'사람 검토':'통과'}</td></tr>`).join('')}).catch(e=>{summary.innerHTML='<article class="card warn">데이터 로드 실패</article>';console.error(e)});
</script></body></html>
