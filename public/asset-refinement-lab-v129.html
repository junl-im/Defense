<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v1.0.29 에셋 정제 검수</title><style>
:root{color-scheme:dark;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;background:#090d17;color:#f6eedb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203155,#0c1221 46%,#060910);min-height:100vh}.wrap{max-width:1300px;margin:auto;padding:24px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}.badge{border:1px solid #65cdf7;border-radius:999px;padding:6px 10px;color:#9ee8ff;background:#10283a}h1{margin:10px 0 4px;font-size:clamp(28px,5vw,54px)}p{color:#bfc9dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{background:#121a2aeb;border:1px solid #34435d;border-radius:18px;padding:16px;box-shadow:0 16px 40px #0007}.preview{width:100%;background:#05070d;border:1px solid #33415b;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}.n{font-size:30px;font-weight:900;color:#ffe49a}.ok{color:#75e5a6}.warn{color:#ffc86d}.small{font-size:13px;color:#aeb8cb}code{color:#9fe8ff}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2e3a50;text-align:left}</style></head><body><main class="wrap"><div class="top"><div><span class="badge">ASSET REFINEMENT ASSURANCE</span><h1>v1.0.29 에셋 정제 검수</h1><p>승인 원본의 보이는 픽셀과 알파를 보존하고 런타임 샘플링만 정제합니다.</p></div><div id="identity" class="small">불러오는 중…</div></div><section id="summary" class="summary"></section><section class="grid"><article class="card"><h2>원본 승인 아틀라스</h2><img class="preview" src="./assets/visual-v117/directional/guardian-ember-pupu-atlas-medium-v117.webp" alt="v1.0.17 원본 승인 아틀라스"><p class="small">최종 승인 원본은 수정하지 않습니다.</p></article><article class="card"><h2>v1.0.29 파생 아틀라스</h2><img class="preview" src="./assets/visual-v129/directional/guardian-ember-pupu-atlas-medium-v129.webp" alt="v1.0.29 런타임 파생 아틀라스"><p class="small">투명 영역 RGB 확장과 셀 경계 안전 여백을 적용했습니다.</p></article></section><section class="card" style="margin-top:16px"><h2>해상도별 무결성</h2><table><thead><tr><th>품질</th><th>크기</th><th>66셀</th><th>알파</th><th>보이는 픽셀</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
Promise.all([fetch('./version.json',{cache:'no-store'}).then(r=>r.json()),fetch('./assets/visual-v129/asset-refinement-profile-v129.json',{cache:'no-store'}).then(r=>r.json())]).then(([v,p])=>{identity.textContent=`${v.releaseVersion} · ${v.buildId}`;const cells=p.atlases.reduce((s,a)=>s+a.cells.length,0);summary.innerHTML=[['파생 아틀라스',p.atlases.length],['프로필 셀',cells],['방향',p.directions.length],['액션',p.actions.length],['신규 최종 원화',0]].map(([k,n])=>`<div class="card"><div class="n">${n}</div><div>${k}</div></div>`).join('');rows.innerHTML=p.atlases.map(a=>`<tr><td>${a.quality}</td><td>${a.width}×${a.height}</td><td>${a.cells.length}</td><td class="${a.alphaPreserved?'ok':'warn'}">${a.alphaPreserved?'보존':'확인 필요'}</td><td class="${a.visiblePixelsPreserved?'ok':'warn'}">${a.visiblePixelsPreserved?'보존':'확인 필요'}</td></tr>`).join('')}).catch(e=>identity.textContent=`오류: ${e.message}`)</script></body></html>
