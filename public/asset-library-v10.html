<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#071321" />
  <title>Dokkaebi Asset Forge Review OS v10</title>
  <style>
    :root{color-scheme:dark;--bg:#06101b;--panel:#0d1b2a;--line:#29445f;--gold:#ffda76;--cyan:#74e7ff;--muted:#a1b2c6;--danger:#ff8383;--ok:#8ff5b6;--warn:#ffc875}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#183552 0,#081421 36%,#040910 100%);color:#f4f8ff;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:6;padding:17px clamp(13px,3vw,34px);background:#071321f2;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}h1{margin:0;font-size:clamp(22px,4vw,38px);letter-spacing:-.04em}h1 em{color:var(--gold);font-style:normal}.subtitle{margin:5px 0 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(6,minmax(112px,1fr));gap:7px;margin-top:13px}.summary article{padding:9px 11px;border:1px solid var(--line);border-radius:13px;background:#102034}.summary small,.card small{display:block;color:var(--muted);font-size:10px}.summary b{font-size:19px}.summary .approved b{color:var(--danger)}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}.tools button,.tools input,.tools select{min-height:38px;padding:8px 11px;border:1px solid #355675;border-radius:10px;background:#102033;color:#fff}.tools button.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px #ffda7655 inset}.tools button.primary{background:linear-gradient(180deg,#315c79,#17344d);border-color:#70dff2}.tools input{min-width:min(290px,100%);flex:1}.notice{padding:11px clamp(13px,3vw,34px);border-bottom:1px solid #4c3924;background:#2c2114;color:#ffdfad}.notice b{color:#fff}.review-progress{padding:10px clamp(13px,3vw,34px);border-bottom:1px solid var(--line);background:#091725;color:var(--muted)}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;padding:18px clamp(13px,3vw,34px) 60px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#122338,#0a1523);box-shadow:0 12px 30px #0005;cursor:pointer}.card[data-review="pass"]{border-color:#4ca875}.card[data-review="rework"]{border-color:#b98945}.card[data-review="reject"]{border-color:#a74e59}.thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;background-color:#d7d7d7;background-image:linear-gradient(45deg,#bdbdbd 25%,transparent 25%),linear-gradient(-45deg,#bdbdbd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bdbdbd 75%),linear-gradient(-45deg,transparent 75%,#bdbdbd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;overflow:hidden}.thumb.source{background:#e9edf2}.thumb.silhouette{background:radial-gradient(circle,#183e59,#07111d 72%)}.thumb img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:999px;background:#07101ddd;border:1px solid #ffffff30;color:var(--gold);font-size:9px;font-weight:850}.score{position:absolute;right:8px;top:8px;padding:5px 7px;border-radius:999px;background:#07101ddd;border:1px solid #ffffff30;color:var(--cyan);font-size:9px;font-weight:900}.info{padding:11px}.id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:10px}.family{color:var(--cyan);font-size:9px;margin-top:6px}.review-tag{margin-top:8px;display:inline-flex;padding:4px 7px;border-radius:7px;background:#18293a;color:var(--muted);font-size:9px;font-weight:900}.card[data-review="pass"] .review-tag{color:var(--ok)}.card[data-review="rework"] .review-tag{color:var(--warn)}.card[data-review="reject"] .review-tag{color:var(--danger)}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}dialog{width:min(980px,95vw);border:1px solid var(--line);border-radius:18px;background:#0a1624;color:#fff;padding:0;box-shadow:0 24px 80px #000c}dialog::backdrop{background:#02050bcc}.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(285px,.75fr)}.detail-visual{min-height:520px;display:grid;place-items:center;background-color:#d7d7d7;background-image:linear-gradient(45deg,#bdbdbd 25%,transparent 25%),linear-gradient(-45deg,#bdbdbd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bdbdbd 75%),linear-gradient(-45deg,transparent 75%,#bdbdbd 75%);background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0}.detail-visual.source{background:#e9edf2}.detail-visual.silhouette{background:radial-gradient(circle,#183e59,#07111d 72%)}.detail img{width:100%;height:100%;max-height:75vh;object-fit:contain}.detail section{padding:20px}.detail h2{overflow-wrap:anywhere}.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}.detail dt{color:var(--muted)}.detail dd{margin:0}.close{float:right;border:1px solid var(--line);background:#14283d;color:#fff;border-radius:10px;padding:7px 10px}.detail-modes,.review-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.detail-modes button,.review-actions button{min-height:38px;border:1px solid var(--line);border-radius:10px;background:#112338;color:#dce8f4;font-weight:800}.detail-modes button.active{border-color:var(--gold);color:var(--gold)}.review-actions button[data-state="pass"]{color:var(--ok)}.review-actions button[data-state="rework"]{color:var(--warn)}.review-actions button[data-state="reject"]{color:var(--danger)}.review-actions button.active{box-shadow:0 0 0 2px currentColor inset}.warning{margin-top:12px;padding:9px;border-radius:10px;background:#2c2015;color:#ffd9a0;font-size:10px}@media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail-visual{min-height:340px}.detail img{max-height:48vh}}
  </style>
</head>
<body>
<header>
  <h1>DOKKAEBI <em>ASSET FORGE REVIEW OS</em> v10</h1>
  <p class="subtitle">원본·투명 파생본·0.3초 실루엣을 비교하고 사람의 리뷰 결정을 JSON으로 내보냅니다.</p>
  <div id="summary" class="summary"></div>
  <div class="tools">
    <button class="active" data-mode="presentation">투명 파생본</button>
    <button data-mode="silhouette">실루엣</button>
    <button data-mode="source">원본</button>
    <select id="category"><option value="all">모든 분류</option></select>
    <select id="review"><option value="all">모든 리뷰</option><option value="pending">미검수</option><option value="pass">통과 후보</option><option value="rework">수정 필요</option><option value="reject">제외</option></select>
    <input id="search" type="search" placeholder="ID 또는 패밀리 검색" />
    <button id="export" class="primary">리뷰 JSON 저장</button>
    <button id="clear">리뷰 초기화</button>
  </div>
</header>
<div class="notice"><b>절대 규칙:</b> 자동 배경 분리 통과는 제작 승인이 아닙니다. 40종 모두 단일 시점 콘셉트이며 최종 3D·턴어라운드·모션·소켓 검증이 필요합니다.</div>
<div id="progress" class="review-progress">리뷰 상태를 불러오는 중...</div>
<main id="grid"><div class="empty">Asset Forge 매니페스트를 불러오는 중...</div></main>
<dialog id="detail"><div class="detail"><div id="detail-visual" class="detail-visual"><img id="detail-img" alt="" /></div><section><button class="close" type="button">닫기</button><small>ABSOLUTE ART REVIEW</small><h2 id="detail-title"></h2><dl id="detail-meta"></dl><div class="detail-modes"><button data-detail-mode="presentation">투명</button><button data-detail-mode="silhouette">실루엣</button><button data-detail-mode="source">원본</button></div><div class="review-actions"><button data-state="pass">통과 후보</button><button data-state="rework">수정 필요</button><button data-state="reject">제외</button></div><div class="warning">이 결정은 로컬 리뷰 메모입니다. production-approved를 자동 부여하지 않습니다.</div></section></div></dialog>
<script>
const STORAGE='dokkaebi-asset-review-v10';let assets=[],activeMode='presentation',selected=null;const decisions=JSON.parse(localStorage.getItem(STORAGE)||'{}');const grid=document.querySelector('#grid'),search=document.querySelector('#search'),category=document.querySelector('#category'),review=document.querySelector('#review'),detail=document.querySelector('#detail');
const pathFor=(a,mode)=>mode==='source'?a.sourcePath:mode==='silhouette'?a.silhouettePath:a.presentationPath;const labelFor=s=>({pass:'통과 후보',rework:'수정 필요',reject:'제외',pending:'미검수'})[s]||'미검수';
function stateOf(id){return decisions[id]?.state||'pending'}function saveDecision(id,state){decisions[id]={state,reviewedAt:new Date().toISOString(),note:'local-human-review-only'};localStorage.setItem(STORAGE,JSON.stringify(decisions));render();if(selected?.id===id)syncActions()}
function renderProgress(){const counts={pending:0,pass:0,rework:0,reject:0};assets.forEach(a=>counts[stateOf(a.id)]++);document.querySelector('#progress').textContent=`검수 ${assets.length-counts.pending}/${assets.length} · 통과 후보 ${counts.pass} · 수정 ${counts.rework} · 제외 ${counts.reject} · 제작 승인 0`;}
function render(){const q=search.value.trim().toLowerCase(),cat=category.value,rv=review.value;const list=assets.filter(a=>(cat==='all'||a.category===cat)&&(rv==='all'||stateOf(a.id)===rv)&&(!q||`${a.id} ${a.family}`.toLowerCase().includes(q))).sort((a,b)=>b.metrics.matteConfidence-a.metrics.matteConfidence||a.id.localeCompare(b.id));grid.innerHTML=list.length?list.map(a=>{const state=stateOf(a.id);return `<article class="card" data-id="${a.id}" data-review="${state}"><div class="thumb ${activeMode}"><img loading="lazy" src="${pathFor(a,activeMode)}" alt="${a.id}"><span class="badge">${activeMode.toUpperCase()}</span><span class="score">${Math.round(a.metrics.matteConfidence*100)}</span></div><div class="info"><div class="id">${a.id}</div><div class="meta"><span>${a.category}</span><span>alpha ${Math.round(a.metrics.alphaCoverage*100)}%</span></div><div class="family">${a.family}</div><span class="review-tag">${labelFor(state)}</span></div></article>`}).join(''):`<div class="empty">조건에 맞는 후보가 없습니다.</div>`;grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(assets.find(a=>a.id===el.dataset.id)));renderProgress()}
function setDetailMode(mode){if(!selected)return;document.querySelectorAll('[data-detail-mode]').forEach(b=>b.classList.toggle('active',b.dataset.detailMode===mode));const visual=document.querySelector('#detail-visual');visual.className=`detail-visual ${mode}`;document.querySelector('#detail-img').src=pathFor(selected,mode)}
function syncActions(){document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',stateOf(selected.id)===b.dataset.state))}
function openDetail(a){if(!a)return;selected=a;document.querySelector('#detail-title').textContent=a.id;document.querySelector('#detail-meta').innerHTML=`<dt>분류</dt><dd>${a.category}</dd><dt>패밀리</dt><dd>${a.family}</dd><dt>매팅 신뢰도</dt><dd>${Math.round(a.metrics.matteConfidence*100)}%</dd><dt>알파 점유</dt><dd>${Math.round(a.metrics.alphaCoverage*100)}%</dd><dt>경계 접촉</dt><dd>${a.metrics.borderTouch?'YES':'NO'}</dd><dt>자동 프레젠테이션</dt><dd>${a.metrics.presentationReady?'READY':'REVIEW'}</dd><dt>제작 승인</dt><dd>NO</dd>`;setDetailMode(activeMode);syncActions();detail.showModal()}
function exportReview(){const payload={schemaVersion:1,gameVersion:'10.0.0',exportedAt:new Date().toISOString(),styleLock:'DD-ABSOLUTE-ART-BIBLE-2.0',productionApproved:0,decisions:Object.entries(decisions).map(([id,value])=>({id,...value}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`dokkaebi-asset-review-v10-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('.close').onclick=()=>detail.close();detail.onclick=e=>{if(e.target===detail)detail.close()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeMode=b.dataset.mode;render()});document.querySelectorAll('[data-detail-mode]').forEach(b=>b.onclick=()=>setDetailMode(b.dataset.detailMode));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>selected&&saveDecision(selected.id,b.dataset.state));search.oninput=render;category.onchange=render;review.onchange=render;document.querySelector('#export').onclick=exportReview;document.querySelector('#clear').onclick=()=>{if(confirm('로컬 리뷰 결정을 모두 초기화할까요?')){Object.keys(decisions).forEach(k=>delete decisions[k]);localStorage.removeItem(STORAGE);render()}};
fetch('./assets/ip-v10/asset-forge-v10.json').then(r=>r.json()).then(data=>{assets=data.assets;const s=data.summary;document.querySelector('#summary').innerHTML=`<article><small>원본 후보</small><b>${s.sourceCandidates}</b></article><article><small>투명 파생본</small><b>${s.transparentPresentationDerivatives}</b></article><article><small>실루엣</small><b>${s.silhouetteDerivatives}</b></article><article><small>UI·VFX</small><b>${s.uiAndVfxDerivatives}</b></article><article><small>자동 준비</small><b>${s.presentationReadyByAutomation}</b></article><article class="approved"><small>최종 승인</small><b>${s.productionApproved}</b></article>`;[...new Set(assets.map(a=>a.category))].sort().forEach(c=>category.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));render()}).catch(e=>grid.innerHTML=`<div class="empty">매니페스트 로드 실패: ${e.message}</div>`);
</script>
</body>
</html>
